# The hymns suggested under "Hymns of the Day" on the Sunday page.
#
#   title          the full name, printed whenever it fits on one line
#   short          printed when the title doesn't fit (optional: otherwise the
#                  abbreviations below are used)
#   also           other names and spellings that find this hymn
#   mode           only when the hymn is always in one mode: 1-4, then
#                  pl. 1 = 5, pl. 2 = 6, grave = 7, pl. 4 = 8
#   page           the English page in the hymnal (always odd), or Choir/Handout
#   pages_by_mode  the page for each mode, when it depends on the mode
#
# Modes come from past bulletins and the Digital Chant Stand. A hymn without
# a mode just leaves the Mode box for you to fill in.

abbreviations:
  Apolytikion: Apol.
  Kontakion: Kont.
  Sunday: Sun.

