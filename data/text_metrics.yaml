# Constants for text_sizing.py (see docs/text_sizing.md). Lengths are in
# em of the reading font size. Spacings and leading come from layout.yaml.
# Checked by eye against rendered PDFs; if pages come out consistently
# underfilled or overflowing, adjust glyph_advance_em first.
glyph_advance_em: 0.41    # mean advance per character of body text, spaces included
heading_advance_em: 0.45  # same, for bold headings
wrap_efficiency: 0.95     # fraction of the line width filled by greedy wrapping
line_pitch_em: 1.31       # baseline to baseline within a paragraph
epistle_fixed_em: 5.5     # prokeimenon heading, reading heading (1 line), chapverse, gaps
alleluia_fixed_em: 2.2    # heading and the gap above it
gospel_fixed_em: 4.0      # reading heading (1 line), chapverse, gaps
flow_slack_em: 2.5        # lost at a free page break (partial line, pushed heading)
safety_margin: 0.03       # solve against height * (1 - safety_margin)
