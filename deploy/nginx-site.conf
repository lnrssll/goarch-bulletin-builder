# /etc/nginx/sites-available/bulletin
# Edit server_name to your domain, then symlink to sites-enabled.
# Run: certbot --nginx -d bulletin.example.org

server {
    listen 80;
    server_name bulletin.example.org;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name bulletin.example.org;

    client_max_body_size 1m;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # downloading a Sunday's readings from goarch.org can take up to a minute
        proxy_read_timeout 120s;
    }
}
