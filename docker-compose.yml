services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    # .env.local for trying it on this computer; ENV_FILE=.env.prod on a server
    env_file: ${ENV_FILE:-.env.local}
    volumes:
      - build:/app/build
      - archive:/app/archive

volumes:
  build:
  archive:
