[project]
name = "goarch-bulletin-builder"
version = "0.1.0"
description = "Weekly Divine Liturgy bulletin: GOARCH scraper and Typst layout"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "httpx>=0.28.1",
    "lxml>=6.0.2",
    "pyyaml>=6.0.3",
    "selectolax>=0.4.4",
]

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "ipython>=9.7.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
