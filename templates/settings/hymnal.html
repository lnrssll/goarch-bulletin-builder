<label>Page numbers
  <textarea name="hymnal_index" rows="24" class="code" spellcheck="false">{{ settings.hymnal_index }}</textarea>
</label>
<p class="hint">One hymn per line: title | page | section, as in “Ordinary Kontakion | 225 | Kontakia”. The English hymns are on the odd pages.</p>
<p class="hint">The page numbers that the hymn suggestions fill in come with the program. After a new edition of the hymnal, ask whoever looks after the program to update those too.</p>
