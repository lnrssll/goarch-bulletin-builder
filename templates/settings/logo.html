<figure class="logo">
  <img src="/settings/logo-picture?v={{ settings.logo | urlencode }}" alt="The logo now">
  <figcaption>The logo now</figcaption>
</figure>
<label>New logo
  <input type="file" name="logo" accept="image/png,image/jpeg,image/webp" required>
</label>
<p class="hint">A PNG, JPEG or WebP picture, up to 5 MB. A wide logo with little empty space around it prints best.</p>
