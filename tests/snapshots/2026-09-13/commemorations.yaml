commemorations:
- hymns: []
  public_url: http://www.goarch.org/chapel/saints?contentid=1165&PCode=SBHC&D=S&date=09/13/2026
  title: Sunday before Holy Cross
  url: http://onlinechapel.goarch.org/saints.asp?contentid=1165&PCode=SBHC&D=S&date=09/13/2026
- hymns:
  - body: Thou hast shown the earthly beauty of the holy tabernacle of Thy glory to
      be like unto the splendour of the heavenly firmament, O Lord.  Strengthen it
      for ever and ever, and accept our prayers which we unceasingly offer therein
      unto Thee, through the Theotokos, O Thou Who art the Life and Resurrection of
      all.
    short_title: Apolytikion of Temple of the Resurrection
    title: Apolytikion of Temple of the Resurrection in the Fourth Tone
    tone: Fourth Tone
    type: apolytikion
  - body: 'The Church is shown to be a many-lighted heaven that doth shine a guiding
      light upon all them that do believe; wherein while standing we cry aloud:  Do
      Thou Thyself now establish this house, O Lord.'
    short_title: Kontakion of Temple of the Resurrection
    title: Kontakion of Temple of the Resurrection in the Fourth Tone
    tone: Fourth Tone
    type: kontakion
  public_url: http://www.goarch.org/chapel/saints?contentid=596
  title: The Consecration of the Church of the Holy Resurrection (Holy Sepulchre)
  url: http://onlinechapel.goarch.org/saints.asp?contentid=596
- hymns:
  - body: We offer Thee in mediation the life-giving Cross which, of Thy goodness,
      Thou hast given unto us, the unworthy, O Lord.  Save Thy hierarchs and Thy flock,
      and grant Thou peace through the Theotokos, O only friend of man.
    short_title: Apolytikion of Forefeast of the Exaltation
    title: Apolytikion of Forefeast of the Exaltation in the Second Tone
    tone: Second Tone
    type: apolytikion
  public_url: http://www.goarch.org/chapel/saints?contentid=597
  title: Forefeast of the Elevation of the Holy Cross
  url: http://onlinechapel.goarch.org/saints.asp?contentid=597
- hymns:
  - body: The Church hath received thee as the holy first-fruits of the nations; for
      thou dost illumine her with thy great deeds of godly virtues, O hallowed and
      sacred initiate, most godly Cornelius.
    short_title: Kontakion of Hieromartyr Cornelius
    title: Kontakion of Hieromartyr Cornelius in the Fourth Tone
    tone: Fourth Tone
    type: kontakion
  public_url: http://www.goarch.org/chapel/saints?contentid=204
  title: Cornelius the Centurion & Martyr
  url: http://onlinechapel.goarch.org/saints.asp?contentid=204
