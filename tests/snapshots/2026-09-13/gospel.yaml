book: The Holy Gospel According to St. John
chapverse: 3:13-17
text:
- The Lord said, "No one has ascended into heaven but he who descended from heaven,
  the Son of man who is in heaven. And as Moses lifted up the serpent in the wilderness,
  so must the Son of man be lifted up, that whoever believes in him may have eternal
  life.
- '"For God so loved the world that he gave his only Son, that whoever believes in
  him should not perish but have eternal life. For God sent the Son into the world,
  not to condemn the world, but that the world might be saved through him."'

