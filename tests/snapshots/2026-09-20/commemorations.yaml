commemorations:
- hymns:
  - body: Lifted up on the Cross by Your free will, Christ God, grant mercies to the
      new commonwealth that bears Your name. Gladden our faithful rulers by Your power,
      giving them victories over their adversaries. May Your alliance be for them
      a weapon for peace, an invincible standard.
    short_title: Kontakion of Sun. after Holy Cross
    title: Kontakion of Sun. after Holy Cross in the Fourth Tone
    tone: Fourth Tone
    type: kontakion
  public_url: http://www.goarch.org/chapel/saints?contentid=1162&PCode=SAHC&D=S&date=09/20/2026
  title: Sunday after Holy Cross
  url: http://onlinechapel.goarch.org/saints.asp?contentid=1162&PCode=SAHC&D=S&date=09/20/2026
- hymns:
  - body: Thy Martyrs, O Lord, in their courageous contest for Thee received as the
      prize the crowns of incorruption and life from Thee, our immortal God. For since
      they possessed Thy strength, they cast down the tyrants and wholly destroyed
      the demons' strengthless presumption. O Christ God, by their prayers, save our
      souls, since Thou art merciful.
    short_title: Apolytikion of Martyr Eustathius and His Companions
    title: Apolytikion of Martyr Eustathius and His Companions in the Fourth Tone
    tone: Fourth Tone
    type: apolytikion
  - body: O blest one, since thou didst emulate Christ's sufferings and drankest His
      cup with eagerness, thou didst become a partaker and joint-heir of His glory,
      O wise Eustathius; and since He is God of all things, He gave thee divine power
      from Heaven's heights.
    short_title: Kontakion of Martyr Eustathius and His Companions
    title: Kontakion of Martyr Eustathius and His Companions in the Second Tone
    tone: Second Tone
    type: kontakion
  public_url: http://www.goarch.org/chapel/saints?contentid=211
  title: Eustathius the Great Martyr, his wife and two children
  url: http://onlinechapel.goarch.org/saints.asp?contentid=211
