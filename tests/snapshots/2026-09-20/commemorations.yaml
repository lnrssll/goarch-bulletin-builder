  title: Hilarion the New Martyr of Crete
  url: http://onlinechapel.goarch.org/saints.asp?contentid=2254
- hymns:
  - body: Lord, save Your people and bless Your inheritance, granting our rulers to
      prevail over adversaries, and protecting Your commonwealth by Your Cross.
    short_title: Apolytikion of Afterfeast of the Holy Cross
    title: Apolytikion of Afterfeast of the Holy Cross in the First Tone
    tone: First Tone
    type: apolytikion
