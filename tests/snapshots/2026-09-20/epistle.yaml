book: St. Paul's Letter to the Galatians
chapverse: 2:16-20
mode: 7
prokeimenon: The Lord will give strength to his people.
text:
- Brethren, knowing that a man is not justified by works of the law but through faith
  in Jesus Christ, even we have believed in Christ Jesus, in order to be justified
  by faith in Christ, and not by works of the law, because by works of the law shall
  no one be justified. But if, in our endeavor to be justified in Christ, we ourselves
  were found to be sinners, is Christ then an agent of sin? Certainly not! But if
  I build up again those things which I tore down, then I prove myself a transgressor.
  For I through the law died to the law, that I might live to God. I have been crucified
  with Christ; it is no longer I who live, but Christ who lives in me; and the life
  I now live in the flesh I live by faith in the Son of God, who loved me and gave
  himself for me.
verse: Bring to the Lord, O sons of God, bring to the Lord honor and glory.

