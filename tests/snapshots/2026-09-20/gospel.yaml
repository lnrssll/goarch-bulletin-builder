book: The Holy Gospel According to St. Mark
chapverse: 8:34-38; 9:1
text:
- 'The Lord said: "If anyone wishes to come after me, let him deny himself and take
  up his cross and follow me. For whoever would save his life will lose it; and whoever
  loses his life for my sake and the gospel''s will save it. For what does it profit
  a man, to gain the whole world and forfeit his life? For what can a man give in
  return for his life? For whoever is ashamed of me and my words in this adulterous
  and sinful generation, of him will the Son of man also be ashamed, when he comes
  in the glory of his Father with the holy angels." And he said to them, "Truly, I
  say to you, there are some standing here who will not taste death before they see
  the kingdom of God come with power."'

