- hymns:
  - body: Thy Martyrs, O Lord, in their courageous contest for Thee received as the
      prize the crowns of incorruption and life from Thee, our immortal God. For since
      they possessed Thy strength, they cast down the tyrants and wholly destroyed
      the demons' strengthless presumption. O Christ God, by their prayers, save our
      souls, since Thou art merciful.
    short_title: Apolytikion of Martyr Callistratus & his Companions
    title: Apolytikion of Martyr Callistratus & his Companions in the Fourth Tone
    tone: Fourth Tone
    type: apolytikion
  - body: O all-wise and godly Saints, today the whole Church, showing honour to you
      all, doth now in spirit sing your praise; for ye contested in her behalf, O
      right-victorious Martyrs of Christ our God.
    short_title: Kontakion of Martyr Callistratus & his Companions
    title: Kontakion of Martyr Callistratus & his Companions in the Second Tone
    tone: Second Tone
    type: kontakion
  public_url: http://www.goarch.org/chapel/saints?contentid=219
  title: Callistratus the Martyr & his 49 Companions
  url: http://onlinechapel.goarch.org/saints.asp?contentid=219
- hymns:
  - body: O Holy Apostle Aristarchus, intercede to our merciful God, that He may grant
      our souls forgiveness of sins.
    short_title: Apolytikion of Apostles Mark, Aristarchus, and Zenon
    title: Apolytikion of Apostles Mark, Aristarchus, and Zenon in the Third Tone
    tone: Third Tone
    type: apolytikion
  public_url: http://www.goarch.org/chapel/saints?contentid=735
  title: Mark, Aristarchos, and Zenon, Apostles of the 70
