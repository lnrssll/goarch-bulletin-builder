commemorations:
- hymns:
  - body: You are greatly glorified, O Christ our God, who established our Fathers
      as luminaries upon the earth, and through them led us all to the true Faith.
      O Most compassionate, glory to You.
    short_title: Apolytikion of Sun. of the 7th Ecumenical Council
    title: Apolytikion of Sun. of the 7th Ecumenical Council in the Plagal of the
      Fourth Tone
    tone: Plagal of the Fourth Tone
    type: apolytikion
  - body: The Son who shone forth from the Father, was born of woman in two natures.
      Having beheld Him, we do not deny the image of His form. Devoutly depicting
      it we honor it in faith. Therefore the Church, maintaining the true faith, venerates
      the icon of Christ's incarnation.
    short_title: Kontakion of Sun. of the 7th Ecumenical Council
    title: Kontakion of Sun. of the 7th Ecumenical Council in the Plagal of the Fourth
      Tone
    tone: Plagal of the Fourth Tone
    type: kontakion
  public_url: http://www.goarch.org/chapel/saints?contentid=883&PCode=4LS&D=S&date=10/11/2026
  title: Sunday of the 7th Ecumenical Council
  url: http://onlinechapel.goarch.org/saints.asp?contentid=883&PCode=4LS&D=S&date=10/11/2026
- hymns:
  - body: O Holy Apostle Philip, intercede to our merciful God, that He may grant
      our souls forgiveness of sins.
    short_title: Apolytikion of Philip of the 7 Deacons
    title: Apolytikion of Philip of the 7 Deacons in the Third Tone
    tone: Third Tone
    type: apolytikion
  - body: Since thou wast enlightened by the Holy Spirit, thou enlightenest the earth
      and all its fullness with the beams of thy wise teachings and miracles, Apostle
      Philip, thou sacred initiate.
    short_title: Kontakion of Philip of the 7 Deacons
    title: Kontakion of Philip of the 7 Deacons in the Fourth Tone
    tone: Fourth Tone
    type: kontakion
  public_url: http://www.goarch.org/chapel/saints?contentid=236
  title: Philip the Apostle of the 70, one of the 7 Deacons
  url: http://onlinechapel.goarch.org/saints.asp?contentid=236
- hymns:
  - body: You are a guide of Orthodoxy, a teacher of piety and modesty, a luminary
      of the world, the God inspired pride of monastics. O wise Theophanes, you have
      enlightened everyone by your teachings. You are the harp of the Spirit. Intercede
      to Christ our God for the salvation of our souls.
    short_title: Apolytikion of Theophanes the Confessor
    title: Apolytikion of Theophanes the Confessor in the Plagal of the Fourth Tone
    tone: Plagal of the Fourth Tone
    type: apolytikion
  - body: To the Church thou hast appeared like a new daystar, for thou dost enlighten
      her with all thy doctrines' brilliant beams, O righteous Father Theophanes,
      since thou indeed art a true priest of Christ our God.
    short_title: Kontakion of Theophanes the Confessor
    title: Kontakion of Theophanes the Confessor in the Fourth Tone
    tone: Fourth Tone
    type: kontakion
  public_url: http://www.goarch.org/chapel/saints?contentid=237
  title: Theophanes the Confessor, Bishop of Nicaea
  url: http://onlinechapel.goarch.org/saints.asp?contentid=237
