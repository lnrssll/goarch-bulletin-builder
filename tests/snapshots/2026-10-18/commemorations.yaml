commemorations:
- hymns:
  - body: O Holy Apostle and Evangelist Luke, intercede to our merciful God, that
      He may grant our souls forgiveness of sins.
    short_title: Apolytikion of Luke the Evangelist
    title: Apolytikion of Luke the Evangelist in the Third Tone
    tone: Third Tone
    type: apolytikion
  - body: As a disciple of the Word of God, with Paul you illuminated all the earth
      and dispelled the gloom in writing Christ's divine Gospel.
    short_title: Kontakion of Luke the Evangelist
    title: Kontakion of Luke the Evangelist in the Fourth Tone
    tone: Fourth Tone
    type: kontakion
