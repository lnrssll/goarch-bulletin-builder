book: The Holy Gospel According to St. Luke
chapverse: 10:16-21
text:
- The Lord said to his disciples, “He who hears you hears me, and he who rejects you
  rejects me, and he who rejects me rejects him who sent me.” The seventy returned
  with joy, saying, “Lord, even the demons are subject to us in your name!” And he
  said to them, “I saw Satan fall like lightning from heaven. Behold, I have given
  you authority to tread upon serpents and scorpions, and over all the power of the
  enemy; and nothing shall hurt you. Nevertheless do not rejoice in this, that the
  spirits are subject to you; but rejoice that your names are written in heaven.”
  In that same hour he rejoiced in the Holy Spirit and said, “I thank you, Father,
  Lord of heaven and earth, that you have hidden these things from the wise and understanding
  and revealed them to babes; yes, Father, for such was your gracious will.”

