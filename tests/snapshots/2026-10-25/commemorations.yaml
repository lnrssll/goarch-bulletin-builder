- hymns: []
  public_url: http://www.goarch.org/chapel/saints?contentid=2769
  title: Chrysaphios (or Chrysaphos) the Martyr
  url: http://onlinechapel.goarch.org/saints.asp?contentid=2769
- hymns:
  - body: 'O Lord Jesus, unto Thee Thy lamb doth cry with a great voice:  O my Bridegroom,
      Thee I love; and seeking Thee, I now contest, and with Thy baptism am crucified
      and buried.  I suffer for Thy sake, that I may reign with Thee; for Thy sake
      I die, that I may live in Thee:  accept me offered out of longing to Thee as
      a spotless sacrifice.  Lord, save our souls through her intercessions, since
      Thou art great in mercy.'
    short_title: Apolytikion of Martyr Chrysanthe
    title: Apolytikion of Martyr Chrysanthe in the Fourth Tone
    tone: Fourth Tone
    type: apolytikion
  public_url: http://www.goarch.org/chapel/saints?contentid=2775
  title: Martyr Chrysanthe
  url: http://onlinechapel.goarch.org/saints.asp?contentid=2775

