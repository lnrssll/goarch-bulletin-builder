  title: 6th Sunday of Luke
  url: http://onlinechapel.goarch.org/saints.asp?contentid=939&PCode=6LS&D=S&date=10/25/2026
- hymns:
  - body: Thy Martyrs, O Lord, in their courageous contest for Thee received as the
      prize the crowns of incorruption and life from Thee, our immortal God. For since
      they possessed Thy strength, they cast down the tyrants and wholly destroyed
      the demons' strengthless presumption. O Christ God, by their prayers, save our
      souls, since Thou art merciful.
    short_title: Apolytikion of Martyrs Marcian and Martyrius
    title: Apolytikion of Martyrs Marcian and Martyrius in the Fourth Tone
    tone: Fourth Tone
    type: apolytikion
  - body: Ye struggled well even from earliest childhood, O wise Martyrius and all-blessed
      Marcian, and kept unchanged the Faith held by the Orthodox; for ye cast down
      Arius, the blaspheming apostate, as ye followed after Paul, your divinely-wise
      teacher.  Wherefore with him ye also have found life, as God the Trinity's excellent
      champions.
    short_title: Kontakion of Martyrs Marcian and Martyrius
    title: Kontakion of Martyrs Marcian and Martyrius in the Fourth Tone
    tone: Fourth Tone
    type: kontakion
  public_url: http://www.goarch.org/chapel/saints?contentid=256
  title: The Holy Martyrs Marcian and Martyrius the Notaries
  url: http://onlinechapel.goarch.org/saints.asp?contentid=256
- hymns: []
