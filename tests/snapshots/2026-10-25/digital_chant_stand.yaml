alleluia:
- Stretch Your bow, and grant prosperity, and reign, because of truth and goodness.
- You loved righteousness and hated lawlessness.
dismissal_hymns:
- mode: '4'
  source: Octoechos
  text: When the women disciples of the Lord heard the Angel joyously proclaim the
    resurrection, they cast aside the ancestral verdict, and boasting in glory they
    said to the Apostles, “Death has been despoiled! Christ God has risen, granting
    the great mercy to the world!”
  title: Resurrectional Apolytikion
- mode: '4'
  source: null
  text: Your Martyrs, O Lord, were worthily awarded by You * the crowns of incorruption,
    in that they contested for You our immortal God. * Since they possessed Your power,
    they defeated the tyrants, * dashing the demons’ powerless displays of defiance.
    * O Christ God, at their fervent entreaties, save our souls.
  title: For the Saints
- mode: null
  source: null
  text: O Protection of Christians that never falls, intercession with the Creator
    that never fails, we sinners beg you, do not ignore the voices of our prayers.
    O good Lady, we implore you, quickly come unto our aid, when we cry out to you
    with faith. Hurry to intercession, and hasten to supplication, O Theotokos who
    protect now and ever those who honor you.
  title: Kontakion Mode 2

