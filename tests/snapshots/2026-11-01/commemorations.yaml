- hymns:
  - body: Sainted Unmercenaries and Wonder Workers, regard our infirmities; freely
      you have received, freely share with us.
    short_title: Apolytikion of Unmercenaries Cosmas and Damian
    title: Apolytikion of Unmercenaries Cosmas and Damian in the Third Tone
    tone: Third Tone
    type: apolytikion
  - body: O glorious, wonderworking physicians, having received the grace of healing,
      you reach out and restore health to those in need. But also, by your visitation
      you cast down the arrogance of the enemy, healing the world through miracles.
    short_title: Kontakion of Unmercenaries Cosmas and Damian
    title: Kontakion of Unmercenaries Cosmas and Damian in the Second Tone
    tone: Second Tone
    type: kontakion
  public_url: http://www.goarch.org/chapel/saints?contentid=269
  title: Cosmas and Damian the Holy Unmercenaries of Asia, and their mother Theodota
  url: http://onlinechapel.goarch.org/saints.asp?contentid=269
