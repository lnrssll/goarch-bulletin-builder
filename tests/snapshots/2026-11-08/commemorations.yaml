  public_url: http://www.goarch.org/chapel/saints?contentid=960&PCode=7LS&D=S&date=11/08/2026
  title: 7th Sunday of Luke
  url: http://onlinechapel.goarch.org/saints.asp?contentid=960&PCode=7LS&D=S&date=11/08/2026
- hymns:
  - body: 'O Commanders of the Heavenly Host, we the unworthy beseech you, that through
      your entreaties you will fortify us, guarding us in the shelter of the wings
      of your ethereal glory, even as we fervently bow before you crying: "Deliver
      us from all danger, as Commanders of the Powers on high! "'
    short_title: Apolytikion of Synaxis of the Archangels
    title: Apolytikion of Synaxis of the Archangels in the Fourth Tone
    tone: Fourth Tone
    type: apolytikion
  - body: Chief Commanders of God; ministers of divine glory; guides for men and leadership
      of the Incorporeal; as Chief Commanders of the Incorporeal, plead for our welfare
      and for great mercy.
    short_title: Kontakion of Synaxis of the Archangels
    title: Kontakion of Synaxis of the Archangels in the Second Tone
    tone: Second Tone
    type: kontakion
  public_url: http://www.goarch.org/chapel/saints?contentid=279
  title: 'Synaxis of the Archangel Michael & the other Bodiless Powers: Gabriel, Raphael,
    Uriel, Salaphiel, Jegudiel, & Barachiel'
  url: http://onlinechapel.goarch.org/saints.asp?contentid=279

