alleluia:
- He who dwells in the help of the Most High shall lodge in the shelter of the God
  of heaven.
- He shall say to the Lord, “You are my protector.”
dismissal_hymns:
- mode: Plagal 2
  source: Octoechos
  text: When the angelic powers appeared at Your tomb, * the soldiers guarding it
    feared and became as dead. * And standing by the sepulcher was Mary, who was seeking
    Your immaculate body. * Unassailed by Hades, You divested it of spoils. * Then
    You met the Virgin. You granted life. * O Lord, risen from the dead, glory to
    You!
  title: Resurrectional Apolytikion
- mode: '4'
  source: null
  text: 'O Chief Commanders of the heavenly armies, * we the unworthy now entreat
    you in earnest, * to fortify us by your supplications to the Lord, * and shelter
    us beneath the wings of your spiritual glory, * guarding us who run to you and
    fervently entreat you: * As the Commanders of the hosts on high, * rescue us faithful
    from dangers of every kind.'
  title: For the Angels
- mode: '4'
  source: Menaion
  text: The Savior’s most pure and immaculate temple, the very precious bridal chamber
    and Virgin, who is the sacred treasure of the glory of God, on this day is introduced
    into the House of the Lord, and with herself she brings the grace in the divine
    Spirit. She is extolled by the Angels of God. A heavenly tabernacle is she.
  title: Kontakion

