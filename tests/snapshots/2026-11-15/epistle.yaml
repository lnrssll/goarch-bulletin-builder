book: St. Paul's Letter to the Ephesians
chapverse: 2:14-22
mode: 7
prokeimenon: The Lord will give strength to his people.
text:
- Brethren, Christ is our peace, who has made us both one, and has broken down the
  dividing wall of hostility, by abolishing in his flesh the law of commandments and
  ordinances, that he might create in himself one new man in place of the two, so
  making peace, and might reconcile us both to God in one body through the cross,
  thereby bringing the hostility to an end. And he came and preached peace to you
  who were far off and peace to those who were near; for through him we both have
  access in one Spirit to the Father. So then you are no longer strangers and sojourners,
  but you are fellow citizens with the saints and members of the household of God,
  built upon the foundation of the apostles and prophets, Christ Jesus himself being
  the cornerstone, in whom the whole structure is joined together and grows into a
  holy temple in the Lord; in whom you also are built into it for a dwelling place
  of God in the Spirit.
verse: Bring to the Lord, O sons of God, bring to the Lord honor and glory.

